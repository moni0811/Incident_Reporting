name: Tests and Build Docker CI image

on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
       python -m pip install --upgrade pip
       if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
       
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Unit test with pytest
      run: |
        pytest tests/test_policy_engine.py -v
        pytest tests/test_policy_idempotence.py -v
        
  build_and_push:
    needs: unit_test
    runs-on: ubuntu-latest
 
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with: 
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and Push the 311-ingestor Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./311_ingestor
        push: true
        tags: ${{ vars.DOCKER_USERNAME }}/311-ingestor:${{ github.sha }}

    - name: Build and Push the client-api Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./client
        push: true
        tags: ${{ vars.DOCKER_USERNAME }}/client-api:${{ github.sha }}

    - name: Build and Push the escalation-agent Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ vars.DOCKER_USERNAME }}/escalation-agent:${{ github.sha }}

    - name: Build and Push the triage-agent Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./triage_agent
        push: true
        tags: ${{ vars.DOCKER_USERNAME }}/triage-agent:${{ github.sha }}
    
  kind_deploy_and_test:
    needs: build_and_push
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create KIND cluster
      uses: helm/kind-action@v1
      with:
        wait: 120s
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with: 
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      
    - name: Pull images from Docker Hub
      run: |
        docker pull ${{ vars.DOCKER_USERNAME }}/311-ingestor:${{ github.sha }}
        docker pull ${{ vars.DOCKER_USERNAME }}/client-api:${{ github.sha }}
        docker pull ${{ vars.DOCKER_USERNAME }}/escalation-agent:${{ github.sha }}
        docker pull ${{ vars.DOCKER_USERNAME }}/triage-agent:${{ github.sha }}
        
    - name: Load the images to KIND cluster
      run: |
        kind load docker-image ${{ vars.DOCKER_USERNAME }}/311-ingestor:${{ github.sha }} --name chart-testing
        kind load docker-image ${{ vars.DOCKER_USERNAME }}/client-api:${{ github.sha }} --name chart-testing
        kind load docker-image ${{ vars.DOCKER_USERNAME }}/escalation-agent:${{ github.sha }} --name chart-testing
        kind load docker-image ${{ vars.DOCKER_USERNAME }}/triage-agent:${{ github.sha }} --name chart-testing
    
    - name: Create or Update Kubernetes Secrets
      run: |
        kubectl create secret generic app-secret \
          --from-literal=DB_HOST="${{ secrets.DB_HOST }}" \
          --from-literal=DB_NAME="${{ secrets.DB_NAME }}" \
          --from-literal=DB_USER="${{ secrets.DB_USER }}" \
          --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
          --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
          --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
          --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
          --from-literal=AWS_REGION="${{ secrets.AWS_REGION }}" \
          --from-literal=ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
          --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Create or Update Kubernetes ConfigMap
      run: |
        kubectl create configmap app-env-variables \
          --from-literal=ESCALATION_AGENT_URL="${{ vars.ESCALATION_AGENT_URL }}" \
          --from-literal=TRIAGE_AGENT_URL="${{ vars.TRIAGE_AGENT_URL }}" \
          --dry-run=client -o yaml | kubectl apply -f -
          
    - name: Deploy to cluster
      run: |
        export IMAGE_TAG=${{ github.sha }}
        export DOCKER_USERNAME=${{ vars.DOCKER_USERNAME }}
        for f in k8s/*.yml; do
          [ -f "$f" ] && envsubst '${IMAGE_TAG} ${DOCKER_USERNAME}' < $f | kubectl apply -f -
        done

    - name: Debug pod status
      run: |
        echo "=== All Pods ==="
        kubectl get pods -A
        echo "=== Describe ingestor pod ==="
        kubectl describe pod -l app=ingestor-311
        echo "=== Ingestor logs ==="
        kubectl logs -l app=ingestor-311 --tail=50 || true
      if: always()    # runs even if previous step failed
      
    - name: Wait for rollout
      run: |
        kubectl rollout status statefulset/postgres-db --timeout=180s
        kubectl rollout status deployment/ingestor-311-deployment --timeout=180s
        kubectl rollout status deployment/client-api-deployment --timeout=180s
        kubectl rollout status deployment/escalation-agent-deployment --timeout=180s
        kubectl rollout status deployment/triage-agent-deployment --timeout=180s

    - name: Debug pod status after rollout
      if: always()
      run: |
        echo "=== All Pods ==="
        kubectl get pods -A
        echo "=== client-api logs ==="
        kubectl logs deployment/client-api-deployment --tail=80 || true
        kubectl logs deployment/client-api-deployment --previous --tail=80 || true
        echo "=== escalation-agent logs ==="
        kubectl logs deployment/escalation-agent-deployment --tail=80 || true
        kubectl logs deployment/escalation-agent-deployment --previous --tail=80 || true
        echo "=== triage-agent logs ==="
        kubectl logs deployment/triage-agent-deployment --tail=80 || true        
        kubectl logs deployment/triage-agent-deployment --previous --tail=80 || true  
        echo "=== ingestor-311 logs ==="
        kubectl logs deployment/ingestor-311-deployment --tail=80 || true
        echo "=== postgres logs ==="
        kubectl logs statefulset/postgres-db --tail=50 || true
    
    - name: Debug service connectivity
      if: always()
      run: |
        echo "=== Services ==="
        kubectl get svc
        echo "=== Test escalation agent reachability ==="
        kubectl run curl-test --image=curlimages/curl --rm -it --restart=Never -- \
          curl -f http://escalation-agent-service/health || true
        echo "=== client-api logs ==="
        kubectl logs deployment/client-api-deployment --tail=80 || true
        echo "=== Test triage agent reachability ==="
        kubectl run curl-test --image=curlimages/curl --rm -it --restart=Never -- \
          curl -f http://triage-agent-service/health || true

    - name: Run smoke tests
      run: |
         kubectl port-forward svc/client-api-service 8000:80 &
         sleep 30
         curl -f http://localhost:8000/health/live

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
       python -m pip install --upgrade pip
       if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
       
    - name: integration test with pytest
      run: |
        curl -f http://localhost:8000/health/ready
        pytest tests/test_api_contract.py -v
        pytest tests/test_integration_e2e.py -v
        pytest tests/test_performance_latency.py -v
        pytest tests/test_pii_logs.py -v
        pytest tests/test_security_tokens.py -v

    - name: Debug app logs after integration tests
      if: always()
      run: |
        echo "=== client-api logs during tests ==="
        kubectl logs deployment/client-api-deployment --tail=100 || true
        echo "=== escalation-agent logs during tests ==="
        kubectl logs deployment/escalation-agent-deployment --tail=100 || true
        echo "=== triage-agent logs during tests ==="
        kubectl logs deployment/triage-agent-deployment --tail=100 || true
