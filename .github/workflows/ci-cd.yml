name: Tests and Build Docker CI image

on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
       python -m pip install --upgrade pip
       if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
       
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Unit test with pytest
      run: |
        pytest tests/test_policy_engine.py -v
        pytest tests/test_policy_idempotence.py -v
        
  build:
    needs: unit_test
    runs-on: ubuntu-latest
 
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with: 
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and Push the 311-ingestor Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./311_ingestor
        push: true
        tags: ${{ vars.DOCKER_USERNAME }}/311-ingestor:${{ github.sha }}

    - name: Build and Push the client-api Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./client
        push: true
        tags: ${{ vars.DOCKER_USERNAME }}/client-api:${{ github.sha }}

    - name: Build and Push the escalation-agent Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./escalation_agent
        push: true
        tags: ${{ vars.DOCKER_USERNAME }}/escalation-agent:${{ github.sha }}

    - name: Build and Push the triage-agent Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./triage_agent
        push: true
        tags: ${{ vars.DOCKER_USERNAME }}/triage-agent:${{ github.sha }}
        
