apiVersion: apps/v1
kind: Deployment
metadata:
  name: escalation-agent-deployment
  labels:
    app: incident-reporting
    service: escalation-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      service: escalation-agent
  template:
    metadata:
      labels:
        service: escalation-agent
    spec:
      containers:
        - name: incident-reporting-escalation-agent
          image: ${DOCKER_USERNAME}/escalation-agent:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
            - containerPort: 9090
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 200m
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: app-env-variables

---

apiVersion: v1
kind: Service
metadata:
  name: escalation-agent-service
  labels:
    app: incident-reporting
    service: escalation-agent
spec:
  type: ClusterIP
  selector:
    service: escalation-agent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
