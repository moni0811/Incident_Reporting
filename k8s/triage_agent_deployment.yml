apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-agent-deployment
  labels:
    app: incident-reporting
    service: triage-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      service: triage-agent
  template:
    metadata:
      labels:
        service: triage-agent
    spec:
      containers:
        - name: incident-reporting-triage-agent
          image: ${DOCKER_USERNAME}/triage-agent:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 200m
          volumeMounts:
            - name: secret-volume
              mountPath: /etc/secret
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: secret-volume
          secret:
            secretName: app-secret

---

apiVersion: v1
kind: Service
metadata:
  name: triage-agent-service
  labels:
    app: incident-reporting
    service: triage-agent
spec:
  type: ClusterIP
  selector:
    service: triage-agent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000