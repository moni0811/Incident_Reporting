apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-api-deployment
  labels:
    app: incident-reporting
    service: client-api
spec:
  replicas: 1
  selector:
    matchLabels:
      service: client-api
  template:
    metadata:
      labels:
        service: client-api
    spec:
      containers:
        - name: incident-reporting-client-api
          image: ${DOCKER_USERNAME}/client-api:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 200m
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
            - name: secret-volume
              mountPath: /etc/secret
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: app-env-variables
        - name: secret-volume
          secret:
            secretName: app-secret
---

apiVersion: v1
kind: Service
metadata:
  name: client-api-service
  labels:
    app: incident-reporting
    service: client-api
spec:
  type: ClusterIP
  selector:
    service: client-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000